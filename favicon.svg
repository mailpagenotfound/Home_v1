<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Rounded Rect container with dark background and neon green border -->
  <rect x="6" y="6" width="88" height="88" rx="20" fill="#020204" stroke="#22C55E" stroke-width="8" />
  
  <!-- Terminal Prompt symbol >_ in white -->
  <text x="18" y="32" font-family="monospace, monospace" font-weight="900" font-size="24" fill="#ffffff">&gt;_</text>
  
  <!-- "N" in green -->
  <text x="24" y="80" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="54" fill="#22C55E">N</text>
  
  <!-- Cursor cursor block "_" next to "N" -->
  <rect x="62" y="70" width="18" height="8" fill="#22C55E" />
</svg>